services:
  - type: web
    name: notice-board-poster-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT
        sync: false
      - key: AZURE_DOCUMENT_INTELLIGENCE_KEY
        sync: false
      - key: AZURE_DOCUMENT_INTELLIGENCE_API_VERSION
        value: "2024-11-30"
      - key: FOUNDRY_PROJECT_ENDPOINT
        sync: false
      - key: FOUNDRY_AGENT_NAME
        value: "chatgpt4mini"
      - key: FOUNDRY_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
